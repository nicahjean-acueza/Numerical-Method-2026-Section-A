<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REV 3: 3D FRAME MATRIX SOLVER</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; }
        body { background-color: #f8f6fc; color: #332940; display: flex; height: 100vh; overflow: hidden; }

        /* Left Sidebar Controls - Light Purple & White Theme */
        .sidebar {
            width: 320px;
            background: #ffffff;
            border-right: 1px solid #e9d8fd;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 10;
            box-shadow: 2px 0 10px rgba(107, 70, 193, 0.05);
        }

        .app-title { font-size: 14px; font-weight: 800; color: #6b21a8; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
        .section-title { font-size: 11px; font-weight: 700; color: #9333ea; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px; }

        .form-group { margin-bottom: 8px; }
        .form-group label { display: block; font-size: 10px; font-weight: 600; color: #6b7280; margin-bottom: 3px; }
        
        .form-control {
            width: 100%;
            padding: 6px 10px;
            font-size: 11px;
            border: 1px solid #d8b4fe;
            border-radius: 4px;
            background: #faf5ff;
            color: #3b0764;
            outline: none;
        }
        .form-control:focus { border-color: #a855f7; background: #ffffff; }

        .row-3 { display: flex; gap: 6px; }
        .row-3 > div { flex: 1; }

        .btn {
            width: 100%;
            padding: 8px 12px;
            font-size: 11px;
            font-weight: 700;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 4px;
            transition: all 0.2s ease;
        }
        .btn-purple { background: #9333ea; color: #ffffff; }
        .btn-purple:hover { background: #7e22ce; }
        .btn-green { background: #10b981; color: #ffffff; margin-top: 8px; }
        .btn-green:hover { background: #059669; }

        /* Main Workspace */
        .workspace { flex: 1; position: relative; background: #fdfbfd; }
        #plotly-div { width: 100%; height: 100%; }

        /* Right Floating Dashboard Overlay - Soft White & Purple Tint */
        .dashboard-overlay {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 280px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid #e9d8fd;
            border-radius: 6px;
            padding: 12px;
            box-shadow: 0 4px 20px rgba(107, 70, 193, 0.1);
            z-index: 10;
        }

        .dash-title { font-size: 11px; font-weight: 700; color: #6b21a8; text-transform: uppercase; margin-bottom: 8px; }
        
        .legend-item { display: flex; align-items: center; font-size: 10px; margin-bottom: 4px; color: #4b5563; }
        .legend-color { width: 10px; height: 10px; margin-right: 6px; border-radius: 2px; }

        .status-box { margin-top: 10px; font-size: 10px; color: #6b7280; border-bottom: 1px dashed #e9d8fd; padding-bottom: 8px; }
        .status-val { color: #059669; font-weight: 700; }

        /* DOF Table */
        .dof-table { width: 100%; margin-top: 8px; border-collapse: collapse; font-size: 9px; text-align: center; color: #374151; }
        .dof-table th { background: #f3e8ff; color: #6b21a8; padding: 3px; border: 1px solid #e9d8fd; font-weight: 600; }
        .dof-table td { padding: 3px; border: 1px solid #f3e8ff; }
        .dof-table tr:nth-child(even) { background: rgba(243, 232, 255, 0.4); }
    </style>
</head>
<body>

    <!-- Left Input Sidebar -->
    <div class="sidebar">
        <div class="app-title">REV 3: 3D FRAME MATRIX SOLVER</div>

        <!-- Section 1 -->
        <div>
            <div class="section-title">1. Material & Section Properties</div>
            <div class="form-group">
                <label>Elastic Modulus (E) [MPa]</label>
                <input type="number" id="mat-E" class="form-control" value="200000">
            </div>
            <div class="form-group">
                <label>Shear Modulus (G) [MPa]</label>
                <input type="number" id="mat-G" class="form-control" value="77000">
            </div>
            <div class="form-group">
                <label>Section Area (A) [mm²]</label>
                <input type="number" id="sec-A" class="form-control" value="4740">
            </div>
            <div class="form-group">
                <label>Major Inertia (Ix) [mm⁴]</label>
                <input type="number" id="sec-Ix" class="form-control" value="13400000">
            </div>
            <div class="form-group">
                <label>Minor Inertia (Iy) [mm⁴]</label>
                <input type="number" id="sec-Iy" class="form-control" value="1830000">
            </div>
            <div class="form-group">
                <label>Torsion Constant (J) [mm⁴]</label>
                <input type="number" id="sec-J" class="form-control" value="57000">
            </div>
        </div>

        <!-- Section 2 -->
        <div>
            <div class="section-title">2. Node Coordinates</div>
            <div class="form-group">
                <label>Node ID</label>
                <select id="node-id-select" class="form-control" onchange="loadNodeCoords()">
                    <!-- Populated dynamically -->
                </select>
            </div>
            <div class="row-3">
                <div class="form-group"><label>X</label><input type="number" id="node-x" class="form-control" step="0.5"></div>
                <div class="form-group"><label>Y</label><input type="number" id="node-y" class="form-control" step="0.5"></div>
                <div class="form-group"><label>Z</label><input type="number" id="node-z" class="form-control" step="0.5"></div>
            </div>
            <button class="btn btn-purple" onclick="addOrUpdateNode()">Add / Update Node</button>
        </div>

        <!-- Section 3 -->
        <div>
            <div class="section-title">3. Element Management</div>
            <div class="row-3">
                <div class="form-group"><label>Start Node (N1)</label><input type="number" id="elem-n1" class="form-control" value="1"></div>
                <div class="form-group"><label>End Node (N2)</label><input type="number" id="elem-n2" class="form-control" value="2"></div>
            </div>
            <div class="form-group">
                <label>Beta Angle (°)</label>
                <input type="number" id="elem-beta" class="form-control" value="0.0">
            </div>
            <button class="btn btn-purple" onclick="addElement()">Add Element</button>
            <button class="btn btn-green" onclick="renderModel()">Run Analysis</button>
        </div>
    </div>

    <!-- Main Workspace -->
    <div class="workspace">
        <div id="plotly-div"></div>

        <!-- Floating Dashboard Overlay -->
        <div class="dashboard-overlay">
            <div class="dash-title">Analysis Dashboard (REV 3)</div>
            
            <div class="legend-item"><div class="legend-color" style="background: #e11d48;"></div> Pinned Support</div>
            <div class="legend-item"><div class="legend-color" style="background: #f59e0b;"></div> Beam Pin Release</div>
            <div class="legend-item"><div class="legend-color" style="background: #ef4444;"></div> Local X Axis</div>

            <div class="status-box">
                <div>Max Deflection: <span class="status-val">0.000 mm</span></div>
                <div>Solver Status: <span class="status-val">Ready</span></div>
            </div>

            <div class="dash-title" style="margin-top: 10px;">Global Degrees of Freedom (DOF)</div>
            <div style="max-height: 180px; overflow-y: auto;">
                <table class="dof-table">
                    <thead>
                        <tr>
                            <th>Node</th><th>UX</th><th>UY</th><th>UZ</th><th>RX</th><th>RY</th><th>RZ</th>
                        </tr>
                    </thead>
                    <tbody id="dof-table-body">
                        <!-- Dynamic rows -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Model Data State
        let nodes = {
            1: { x: 0, y: 0, z: 0, pinned: true },
            2: { x: 6, y: 0, z: 0, pinned: true },
            3: { x: 6, y: 0, z: 6, pinned: true },
            4: { x: 0, y: 0, z: 6, pinned: true },
            5: { x: 0, y: 6, z: 0, pinned: false },
            6: { x: 6, y: 6, z: 0, pinned: false },
            7: { x: 6, y: 6, z: 6, pinned: false },
            8: { x: 0, y: 6, z: 6, pinned: false }
        };

        let elements = [
            { n1: 1, n2: 2 }, { n1: 2, n2: 3 }, { n1: 3, n2: 4 }, { n1: 4, n2: 1 }, // Base
            { n1: 5, n2: 6 }, { n1: 6, n2: 7 }, { n1: 7, n2: 8 }, { n1: 8, n2: 5 }, // Top
            { n1: 1, n2: 5 }, { n1: 2, n2: 6 }, { n1: 3, n2: 7 }, { n1: 4, n2: 8 }  // Columns
        ];

        function populateNodeSelect() {
            const select = document.getElementById('node-id-select');
            select.innerHTML = '';
            Object.keys(nodes).forEach(id => {
                const option = document.createElement('option');
                option.value = id;
                option.text = `Node ${id}`;
                select.appendChild(option);
            });
            // Option to create a new node ID
            const newOption = document.createElement('option');
            const nextId = Math.max(...Object.keys(nodes).map(Number)) + 1;
            newOption.value = nextId;
            newOption.text = `Node ${nextId} (New)`;
            select.appendChild(newOption);

            loadNodeCoords();
        }

        function loadNodeCoords() {
            const id = document.getElementById('node-id-select').value;
            if (nodes[id]) {
                document.getElementById('node-x').value = nodes[id].x;
                document.getElementById('node-y').value = nodes[id].y;
                document.getElementById('node-z').value = nodes[id].z;
            } else {
                document.getElementById('node-x').value = 0;
                document.getElementById('node-y').value = 0;
                document.getElementById('node-z').value = 0;
            }
        }

        function addOrUpdateNode() {
            const id = parseInt(document.getElementById('node-id-select').value);
            const x = parseFloat(document.getElementById('node-x').value) || 0;
            const y = parseFloat(document.getElementById('node-y').value) || 0;
            const z = parseFloat(document.getElementById('node-z').value) || 0;

            const isNew = !nodes[id];
            nodes[id] = { x, y, z, pinned: y === 0 }; // Auto pin if base floor

            if (isNew) populateNodeSelect();
            renderModel();
        }

        function addElement() {
            const n1 = parseInt(document.getElementById('elem-n1').value);
            const n2 = parseInt(document.getElementById('elem-n2').value);

            if (nodes[n1] && nodes[n2]) {
                elements.push({ n1, n2 });
                renderModel();
            } else {
                alert("Both nodes must exist before adding an element.");
            }
        }

        function updateDOFTable() {
            const tbody = document.getElementById('dof-table-body');
            tbody.innerHTML = '';
            
            Object.keys(nodes).sort((a,b) => a-b).forEach(id => {
                const n = parseInt(id);
                const dofStart = (n - 1) * 6 + 1;
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>N${n}</td>
                    <td>${dofStart}</td>
                    <td>${dofStart+1}</td>
                    <td>${dofStart+2}</td>
                    <td>${dofStart+3}</td>
                    <td>${dofStart+4}</td>
                    <td>${dofStart+5}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function renderModel() {
            let traces = [];

            // 1. Structural Member Lines (Deep Purple)
            elements.forEach(e => {
                const p1 = nodes[e.n1];
                const p2 = nodes[e.n2];
                if (p1 && p2) {
                    traces.push({
                        type: 'scatter3d',
                        mode: 'lines',
                        x: [p1.x, p2.x],
                        y: [p1.z, p2.z],
                        z: [p1.y, p2.y],
                        line: { color: '#7e22ce', width: 4 },
                        hoverinfo: 'none',
                        showlegend: false
                    });
                }
            });

            // 2. Node Markers (Bright Violet / Green Dots)
            const nodeKeys = Object.keys(nodes);
            traces.push({
                type: 'scatter3d',
                mode: 'markers+text',
                x: nodeKeys.map(k => nodes[k].x),
                y: nodeKeys.map(k => nodes[k].z),
                z: nodeKeys.map(k => nodes[k].y),
                marker: { size: 9, color: '#10b981', opacity: 1 },
                text: nodeKeys.map(k => `N${k}`),
                textposition: 'top center',
                textfont: { color: '#3b0764', size: 10 },
                hoverinfo: 'text',
                showlegend: false
            });

            // 3. Pinned Support Pyramids at Base Nodes (Rose/Pink Cones)
            const pinnedNodes = Object.keys(nodes).filter(k => nodes[k].pinned);
            pinnedNodes.forEach(k => {
                const p = nodes[k];
                traces.push({
                    type: 'cone',
                    x: [p.x], y: [p.z], z: [p.y - 0.2],
                    u: [0], v: [0], w: [0.5],
                    sizeref: 0.3,
                    colorscale: [[0, '#e11d48'], [1, '#e11d48']],
                    showscale: false,
                    hoverinfo: 'none'
                });
            });

            // Light Layout styling with soft Grid
            const layout = {
                paper_bgcolor: 'rgba(0,0,0,0)',
                plot_bgcolor: 'rgba(0,0,0,0)',
                margin: { l: 0, r: 0, b: 0, t: 0 },
                scene: {
                    aspectmode: 'data',
                    xaxis: { title: '', color: '#9ca3af', gridcolor: '#e9d8fd', showbackground: false },
                    yaxis: { title: '', color: '#9ca3af', gridcolor: '#e9d8fd', showbackground: false },
                    zaxis: { title: '', color: '#9ca3af', gridcolor: '#e9d8fd', showbackground: false },
                    camera: { eye: { x: 1.5, y: -1.5, z: 1.2 } }
                }
            };

            Plotly.newPlot('plotly-div', traces, layout, { responsive: true, displayModeBar: false });
            updateDOFTable();
        }

        window.onload = () => {
            populateNodeSelect();
            renderModel();
        };
    </script>
</body>
</html>
